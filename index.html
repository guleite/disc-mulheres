<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Que tipo de amiga você é? · Teste DISC</title>
  <meta name="description" content="Descubra seu perfil DISC e como você se conecta nas suas amizades e relacionamentos. Leva 3 minutos e o resultado sai na hora.">
  <meta name="theme-color" content="#FBF3EE">
  <meta property="og:title" content="Que tipo de amiga você é? Faça o teste DISC">
  <meta property="og:description" content="16 perguntas, 3 minutos e um resultado que vai te fazer se enxergar (e enxergar suas amigas) de outro jeito.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23E0607E'/%3E%3Cpath d='M32 46s-14-8.5-14-18a8 8 0 0 1 14-5.3A8 8 0 0 1 46 28c0 9.5-14 18-14 18z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="mode-quiz">

  <!-- Fundo animado -->
  <div class="bg" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <!-- Topo do quiz -->
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-text">Teste DISC <em>·</em> <span data-cfg="EVENT_NAME"></span></span>
    </div>
    <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
  </header>

  <!-- Palco das telas -->
  <main class="stage" id="stage" aria-live="polite"></main>

  <!-- Navegação inferior -->
  <nav class="navbar" id="navbar" aria-label="Navegação do teste">
    <span class="nav-count" id="navCount"></span>
    <div class="nav-btns">
      <button type="button" class="nav-btn" id="btnBack" aria-label="Voltar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button type="button" class="nav-btn" id="btnNext" aria-label="Avançar">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </nav>

  <!-- Resultado (preenchido via JS) -->
  <section class="result" id="result" hidden></section>

  <!-- Área fora da tela usada para gerar o PDF -->
  <div class="pdf-root" id="pdfRoot" aria-hidden="true"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
